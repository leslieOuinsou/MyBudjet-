services:
  postgres:
    image: postgres:16-alpine
    container_name: mybudget-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mybudget
      POSTGRES_PASSWORD: mybudget
      POSTGRES_DB: mybudget
    volumes:
      - mybudget_pgdata:/var/lib/postgresql/data

volumes:
  mybudget_pgdata:
